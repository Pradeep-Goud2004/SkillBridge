spring.application.name=SkillBridge

# Server
server.port=${PORT:8080}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:6300}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


jwt.secret=${JWT_SECRET:SkillBridgeSecretKeyForJwtAuthentication2026VerySecure}
jwt.expiration=${JWT_EXPIRATION:86400000}



frontend.url=${FRONTEND_URL:http://localhost:5173}